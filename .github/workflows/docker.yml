name: Docker Images

on:
  workflow_call:
    inputs:
      event-name:
        required: true
        type: string
      ref:
        required: true
        type: string
      sha:
        required: true
        type: string
      before-sha:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Build image matrix
        id: matrix
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          REF: ${{ inputs.ref }}
          SHA: ${{ inputs.sha }}
          BEFORE_SHA: ${{ inputs.before-sha }}
        run: |
          set -euo pipefail

          append_image() {
            local image="$1"
            local context="$2"
            local dockerfile="$3"

            if [ "$matrix" != "[" ]; then
              matrix="${matrix},"
            fi

            matrix="${matrix}{\"image\":\"${image}\",\"context\":\"${context}\",\"dockerfile\":\"${dockerfile}\"}"
          }

          changed_any() {
            local pattern="$1"
            grep -Eq "$pattern" changed-files.txt
          }

          matrix="["

          if [[ "$REF" == refs/tags/v*.*.* || "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            append_image "contentclip-app" "." "apps/web/Dockerfile"
            append_image "contentclip-worker" "." "apps/worker/Dockerfile"
            append_image "contentclip-migrate" "." "services/postgres/Dockerfile.migrate"
            append_image "contentclip-whisper" "./services/whisper" "./services/whisper/Dockerfile"
            append_image "contentclip-garage-init" "." "services/garage/Dockerfile.init"
          else
            git diff --name-only "$BEFORE_SHA" "$SHA" > changed-files.txt

            if changed_any '^(\.dockerignore|\.github/workflows/docker\.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig\.json|apps/web/)'; then
              append_image "contentclip-app" "." "apps/web/Dockerfile"
            fi

            if changed_any '^(\.dockerignore|\.github/workflows/docker\.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig\.json|apps/worker/|apps/web/src/)'; then
              append_image "contentclip-worker" "." "apps/worker/Dockerfile"
            fi

            if changed_any '^(\.dockerignore|\.github/workflows/docker\.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|services/postgres/|apps/web/src/server/db/schema\.ts)'; then
              append_image "contentclip-migrate" "." "services/postgres/Dockerfile.migrate"
            fi

            if changed_any '^(\.github/workflows/docker\.yml|services/whisper/)'; then
              append_image "contentclip-whisper" "./services/whisper" "./services/whisper/Dockerfile"
            fi

            if changed_any '^(\.github/workflows/docker\.yml|services/garage/)'; then
              append_image "contentclip-garage-init" "." "services/garage/Dockerfile.init"
            fi
          fi

          matrix="${matrix}]"
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.image }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
