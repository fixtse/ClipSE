name: Docker Images

on:
  workflow_call:
    inputs:
      event-name:
        required: true
        type: string
      ref:
        required: true
        type: string
      sha:
        required: true
        type: string
      before-sha:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      worker-base-required: ${{ steps.matrix.outputs.worker-base-required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Build image matrix
        id: matrix
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          REF: ${{ inputs.ref }}
          SHA: ${{ inputs.sha }}
          BEFORE_SHA: ${{ inputs.before-sha }}
        run: |
          set -euo pipefail

          append_image() {
            local image="$1"
            local context="$2"
            local dockerfile="$3"

            if [ "$matrix" != "[" ]; then
              matrix="${matrix},"
            fi

            matrix="${matrix}{\"image\":\"${image}\",\"context\":\"${context}\",\"dockerfile\":\"${dockerfile}\"}"
          }

          changed_any() {
            local pattern="$1"
            grep -Eq "$pattern" changed-files.txt
          }

          matrix="["
          worker_base_required="false"

          if [[ "$REF" == refs/tags/v*.*.* || "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            append_image "clipse-app" "." "apps/web/Dockerfile"
            append_image "clipse-worker" "." "apps/worker/Dockerfile"
            append_image "clipse-migrate" "." "services/postgres/Dockerfile.migrate"
            append_image "clipse-whisper" "./services/whisper" "./services/whisper/Dockerfile"
            append_image "clipse-garage-init" "." "services/garage/Dockerfile.init"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "Unable to resolve one of the comparison commits; building all images." > changed-files.txt
            append_image "clipse-app" "." "apps/web/Dockerfile"
            append_image "clipse-worker" "." "apps/worker/Dockerfile"
            append_image "clipse-migrate" "." "services/postgres/Dockerfile.migrate"
            append_image "clipse-whisper" "./services/whisper" "./services/whisper/Dockerfile"
            append_image "clipse-garage-init" "." "services/garage/Dockerfile.init"
          else
            git diff --name-only "$BEFORE_SHA" "$SHA" > changed-files.txt

            if changed_any '^(\.dockerignore|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig\.json|apps/web/)'; then
              append_image "clipse-app" "." "apps/web/Dockerfile"
            fi

            if changed_any '^(\.dockerignore|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig\.json|apps/worker/|apps/web/src/)'; then
              append_image "clipse-worker" "." "apps/worker/Dockerfile"
            fi

            if changed_any '^(apps/worker/Dockerfile\.base)$'; then
              worker_base_required="true"
            fi

            if changed_any '^(\.dockerignore|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|services/postgres/|apps/web/src/server/db/schema\.ts)'; then
              append_image "clipse-migrate" "." "services/postgres/Dockerfile.migrate"
            fi

            if changed_any '^(services/whisper/)'; then
              append_image "clipse-whisper" "./services/whisper" "./services/whisper/Dockerfile"
            fi

            if changed_any '^(services/garage/)'; then
              append_image "clipse-garage-init" "." "services/garage/Dockerfile.init"
            fi
          fi

          matrix="${matrix}]"
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"
          echo "worker-base-required=${worker_base_required}" >> "$GITHUB_OUTPUT"

          {
            echo "### Docker image matrix"
            echo
            echo '```json'
            echo "{\"include\":${matrix}}"
            echo '```'

            if [ -f changed-files.txt ]; then
              echo
              echo "### Changed files"
              echo
              sed 's/^/- /' changed-files.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-worker-base:
    needs: changes
    if: needs.changes.outputs.worker-base-required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract worker base metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/clipse-worker-base
          tags: |
            type=raw,value=sha-${{ inputs.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push worker base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push:
    needs:
      - changes
      - build-worker-base
    if: always() && needs.changes.outputs.matrix != '{"include":[]}' && (needs.build-worker-base.result == 'success' || needs.build-worker-base.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Resolve worker base image
        id: worker-base
        env:
          NEW_WORKER_BASE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/clipse-worker-base:latest
          LEGACY_WORKER_BASE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/contentclip-worker-base:latest
        run: |
          set -euo pipefail

          if docker manifest inspect "$NEW_WORKER_BASE_IMAGE" >/dev/null 2>&1; then
            echo "image=${NEW_WORKER_BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${LEGACY_WORKER_BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLIPSE_WORKER_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
