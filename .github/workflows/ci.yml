name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  docker-images:
    if: github.event_name != 'pull_request'
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      sha: ${{ github.sha }}
      before-sha: ${{ github.event.before || '' }}
