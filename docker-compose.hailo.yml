services:
  whisper:
    image: ${CLIPSE_WHISPER_HAILO_IMAGE:-clipse-whisper-hailo:local}
    runtime: runc
    build:
      context: ./services/whisper
      dockerfile: Dockerfile.hailo
      args:
        HAILO_APPS_REF: ${HAILO_APPS_REF:-main}
        INSTALL_LOCAL_HAILORT: ${INSTALL_LOCAL_HAILORT:-false}
      additional_contexts:
        hailort_wheel_dir: ${HAILORT_WHEEL_DIR:-./services/whisper/hailo-packages}
    environment:
      WHISPER_PROVIDER: ${WHISPER_PROVIDER:-hailo}
      WHISPER_DEBUG: ${WHISPER_DEBUG:-false}
      HAILO_FOCUS_DEBUG: ${HAILO_FOCUS_DEBUG:-${WHISPER_DEBUG:-false}}
      HAILO_WHISPER_MODEL: ${HAILO_WHISPER_MODEL:-whisper-base}
      HAILO_WHISPER_HEF_PATH: ${HAILO_WHISPER_HEF_PATH:-}
      HAILO_WHISPER_TIMEOUT_MS: ${HAILO_WHISPER_TIMEOUT_MS:-60000}
      HAILO_VLM_MODEL: ${HAILO_VLM_MODEL:-qwen2-vl-2b}
      HAILO_VLM_HEF_PATH: ${HAILO_VLM_HEF_PATH:-}
      HAILO_VLM_FOCUS_SAMPLE_INTERVAL_SECONDS: ${HAILO_VLM_FOCUS_SAMPLE_INTERVAL_SECONDS:-1.0}
      HAILO_VLM_FOCUS_MAX_SAMPLES: ${HAILO_VLM_FOCUS_MAX_SAMPLES:-8}
      HAILO_VLM_OPTIMIZE_MEMORY_ON_DEVICE: ${HAILO_VLM_OPTIMIZE_MEMORY_ON_DEVICE:-true}
      HAILO_VISION_MODEL: ${HAILO_VISION_MODEL:-yolov8n}
      HAILO_VISION_HEF_PATH: ${HAILO_VISION_HEF_PATH:-}
      HAILO_SCREEN_OCR_HEF_PATH: ${HAILO_SCREEN_OCR_HEF_PATH:-}
      HAILO_OBJECT_LABELS: ${HAILO_OBJECT_LABELS:-}
      HAILO_VISION_SAMPLE_INTERVAL_SECONDS: ${HAILO_VISION_SAMPLE_INTERVAL_SECONDS:-0.35}
      HAILO_VISION_MAX_SAMPLES: ${HAILO_VISION_MAX_SAMPLES:-0}
      HAILO_VISION_COMMAND: ${HAILO_VISION_COMMAND:-python /app/hailo_vision_focus_runner.py --video {video} --model {model} --start {start} --end {end} --detection-mode {detection_mode} --sample-interval {sample_interval} --max-samples {max_samples} {hef_arg} {ocr_hef_arg} {object_labels_arg}}
      HAILO_VISION_FRAME_COMMAND: ${HAILO_VISION_FRAME_COMMAND:-}
      HAILO_COMMAND_TIMEOUT_SECONDS: ${HAILO_COMMAND_TIMEOUT_SECONDS:-900}
      LD_LIBRARY_PATH: /usr/lib/hailo:/usr/local/lib:${LD_LIBRARY_PATH:-}
    devices:
      - ${HAILO_DEVICE:-/dev/h1x-0}:${HAILO_DEVICE:-/dev/h1x-0}
    volumes:
      - ${HAILO_HOST_LIB_DIR:-/usr/lib/hailo}:/usr/lib/hailo:ro
      - ${HAILO_HOST_BIN_DIR:-/usr/bin}:/host/usr/bin:ro
