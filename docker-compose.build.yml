services:
  garage-init:
    build:
      context: .
      dockerfile: services/garage/Dockerfile.init

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile

  whisper-hailo:
    image: ${CLIPSE_WHISPER_HAILO_IMAGE:-clipse-whisper-hailo:local}
    build:
      context: ./services/whisper
      dockerfile: Dockerfile.hailo
      args:
        HAILO_APPS_REF: ${HAILO_APPS_REF:-main}
        INSTALL_LOCAL_HAILORT: ${INSTALL_LOCAL_HAILORT:-false}
      additional_contexts:
        hailort_wheel_dir: ${HAILORT_WHEEL_DIR:-./services/whisper/hailo-packages}

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  db-migrate:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile.migrate

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
