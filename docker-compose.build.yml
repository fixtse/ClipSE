services:
  garage-init:
    build:
      context: .
      dockerfile: services/garage/Dockerfile.init

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile

  whisper-hailo:
    image: ${CLIPSE_WHISPER_HAILO_IMAGE:-clipse-whisper-hailo:local}
    build:
      context: ./services/whisper
      dockerfile: Dockerfile.hailo

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  db-migrate:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile.migrate

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
